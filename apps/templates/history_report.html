    <section class="py-1">
      <div class="container">
        <div class="mb-3 text-end align-items-end">
          <select
            id="filter"
            class="form-select"
            style="width: 200px; display: inline-block"
          >
            <option value="all">All</option>
            <option value="Mutu I">Mutu I</option>
            <option value="Mutu II">Mutu II</option>
            <option value="Mutu III">Mutu III</option>
          </select>
          <button onclick="applyFilter()" class="btn btn-warning">
            Filter
          </button>
        </div>
        <table class="table table-bordered">
          <thead class="text-center">
            <tr>
              <th>No</th>
              <th>Citra yang diupload</th>
              <th>Tanggal</th>
              <th>Warna</th>
              <th>kebersihan</th>
              <th>Keretakan</th>
              <th>Prob kebersihan</th>
              <th>Prob Warna</th>
              <th>Prob Keretakan</th>
              <th>Hasil Klasifikasi</th>
              <th>RGB</th>
              <th>GLCM</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody class="text-center" id="table-body">
            <!-- data disini -->
          </tbody>
        </table>
        <nav>
          <ul class="pagination">
            <li class="page-item">
              <button class="page-link" onclick="prevPage()">Previous</button>
            </li>
            <li class="page-item">
              <button class="page-link" onclick="nextPage()">Next</button>
            </li>
          </ul>
        </nav>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      var data = [];
      var filteredData = [];
      var currentPage = 1;
      const rowsPerPage = 5;
      async function fetchKlasifikasi() {
        try {
          const response = await fetch(`http://localhost:3000/api/klasifikasi`);
          if (!response.ok) {
            throw new Error("Gagal mengambil data");
          }
          data = await response.json();
          console.log("Data dari API:", data);
          filteredData = data;
          renderTable();
        } catch (error) {
          console.error("Error:", error);
        }
      }
      function renderTable() {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const paginatedData = filteredData.slice(start, end);

        paginatedData.forEach((item, index) => {
          const rgb = JSON.parse(item.RGB);
          const glcm = JSON.parse(item.GLCM);

          const row = `<tr>
    <td>${start + index + 1}</td>
    <td><img src="http://localhost:3000/${
      item.citra
    }" alt="Egg Image" onclick="openModal('http://localhost:3000/${
            item.citra
          }')"></td>
    <td>${item.tanggal.substring(0, 10)}</td>
    <td>${item.Warna}</td>
    <td>${item.Kebersihan}</td>
    <td>${item.Keretakan}</td>
    <td>${(item.Probabilitas_Kebersihan * 100).toFixed(2)}%</td>
    <td>${(item.Probabilitas_Warna * 100).toFixed(2)}%</td>
    <td>${(item.Probabilitas_Keretakan * 100).toFixed(2)}%</td>
    <td>${item.hasil_klasifikasi}</td>
    <td>R: ${rgb[0].toFixed(1)}, G: ${rgb[1].toFixed(1)}, B: ${rgb[2].toFixed(
            1
          )}</td>
    <td>
      Contrast: ${glcm[0].toFixed(4)}<br>
      Dissimilarity: ${glcm[1].toFixed(4)}<br>
      Homogeneity: ${glcm[2].toFixed(4)}<br>
      Energy: ${glcm[3].toFixed(4)}<br>
      Correlation: ${glcm[4].toFixed(4)}
    </td>
    <td>
      <button class="btn-process" onclick="prosess(${item.id})">Proses</button>
      <button class="btn-delete" onclick="deleteRow(${item.id})">Delete</button>
    </td>
  </tr>`;

          tbody.innerHTML += row;
        });
      }

      function applyFilter() {
        const filterValue = document.getElementById("filter").value;
        filteredData =
          filterValue === "all"
            ? [...data]
            : data.filter((item) => item.hasil_klasifikasi === filterValue);
        currentPage = 1;
        renderTable();
      }
      async function prosess(id) {
        window.location.href = `/proses/${id}`;
      }
      async function deleteRow(id) {
        const confirmation = await Swal.fire({
          title: "Apakah Anda yakin?",
          text: "Data yang dihapus tidak dapat dikembalikan!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#d33",
          cancelButtonColor: "#3085d6",
          confirmButtonText: "Ya, hapus!",
          cancelButtonText: "Batal",
        });

        if (!confirmation.isConfirmed) {
          return;
        }

        try {
          const response = await fetch(
            `http://localhost:3000/api/klasifikasi/${id}`,
            {
              method: "DELETE",
            }
          );

          if (!response.ok) {
            throw new Error("Gagal menghapus data");
          }

          await response.json();

          Swal.fire({
            icon: "success",
            title: "Berhasil!",
            text: "Data berhasil dihapus.",
          });
          fetchKlasifikasi();
        } catch (error) {
          console.error("Error:", error);
          Swal.fire({
            icon: "error",
            title: "Gagal!",
            text: "Terjadi kesalahan saat menghapus data.",
          });
        }
      }

      function nextPage() {
        if (currentPage * rowsPerPage < filteredData.length) {
          currentPage++;
          renderTable();
        }
      }

      function prevPage() {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
        }
      }
      function openModal(imageSrc) {
        Swal.fire({
          imageUrl: imageSrc,
          imageAlt: "Hasil Klasifikasi",
          showCloseButton: true,
          showConfirmButton: false,
          customClass: {
            popup: "swal-wide",
          },
        });
      }
      async function proses(id) {
        console.log("Memproses ID:", id);

        Swal.fire({
          title: "Memproses...",
          text: "Silakan tunggu",
          allowOutsideClick: false,
          allowEscapeKey: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });
        try {
          const response = await fetch(
            `http://localhost:3000/api/proses/${id}`
          );
          if (!response.ok) {
            throw new Error("Gagal mengambil data dari server.");
          }

          const data = await response.json();

          if (data.error) {
            Swal.fire({
              icon: "error",
              title: "Gagal",
              text: data.error,
            });
            return;
          }

          Swal.fire({
            title: "Hasil Klasifikasi",
            html: `
          <img src="${data.citra}" alt="Telur" style="width: 200px; border-radius: 10px; margin-bottom: 10px;">
          <br>
          <b>ID:</b> ${data.id} <br>
          <b>Warna:</b> ${data.Warna} <br>
          <b>Kebersihan:</b> ${data.Kebersihan} <br>
          <b>Hasil Klasifikasi:</b> ${data.hasil_klasifikasi} <br>
      `,
            icon: "success",
            confirmButtonText: "OK",
          });
        } catch (error) {
          Swal.fire({
            icon: "error",
            title: "Terjadi Kesalahan",
            text: error.message,
          });
        }
      }

      fetchKlasifikasi();
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("http://localhost:3000/api/profile", { credentials: "include" })
          .then((response) => response.json())
          .then((data) => {
            if (data.user) {
              document.getElementById("username").innerText =
                data.user.username;
              if (data.user.role === "admin") {
                document.getElementById("admins").style.display = "block";
                document.getElementById("data_admins").style.display = "block";
              }
            } else {
              window.location.href = "/login";
            }
          })
          .catch((error) => console.error("Error fetching user info:", error));

        document
          .getElementById("logoutBtn")
          .addEventListener("click", function (event) {
            event.preventDefault();

            fetch("http://localhost:3000/api/logout", {
              method: "POST",
              credentials: "include",
            })
              .then(() => {
                Swal.fire({
                  icon: "success",
                  title: "Logout Berhasil!",
                  text: "Anda akan dialihkan ke halaman login.",
                  timer: 1500,
                  showConfirmButton: false,
                }).then(() => {
                  window.location.href = "/login";
                });
              })
              .catch((error) => console.error("Error during logout:", error));
          });
      });
    </script>
