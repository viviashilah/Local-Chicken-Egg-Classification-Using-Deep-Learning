    <div class="container mt-5">
      <h2 class="mb-4">Daftar Pengguna</h2>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Verifikasi</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="6" class="text-center">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("http://localhost:3000/api/profile", { credentials: "include" })
          .then((response) => response.json())
          .then((data) => {
            if (data.user) {
              document.getElementById("username").innerText =
                data.user.username;
              if (data.user.role === "admin") {
                document.getElementById("admins").style.display = "block";
                document.getElementById("data_admins").style.display = "block";
              }
            } else {
              window.location.href = "/login";
            }
          })
          .catch((error) => console.error("Error fetching user info:", error));

        document
          .getElementById("logoutBtn")
          .addEventListener("click", function (event) {
            event.preventDefault();

            fetch("http://localhost:3000/api/logout", {
              method: "POST",
              credentials: "include",
            })
              .then(() => {
                Swal.fire({
                  icon: "success",
                  title: "Logout Berhasil!",
                  text: "Anda akan dialihkan ke halaman login.",
                  timer: 1500,
                  showConfirmButton: false,
                }).then(() => {
                  window.location.href = "/login";
                });
              })
              .catch((error) => console.error("Error during logout:", error));
          });
      });
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("http://localhost:3000/api/users", { credentials: "include" })
          .then((response) => response.json())
          .then((data) => {
            const userTableBody = document.getElementById("userTableBody");
            userTableBody.innerHTML = "";

            data.users.forEach((user) => {
              const row = `<tr>
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.email}</td>
                            <td>${
                              user.verifikasi === 1
                                ? "✅ Verified"
                                : "❌ Not Verified"
                            }</td>
                            <td>
                                <button class="btn btn-success btn-sm" onclick="verifyUser(${
                                  user.id
                                })">Verifikasi</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteUser(${
                                  user.id
                                })">Hapus</button>
                            </td>
                        </tr>`;
              userTableBody.innerHTML += row;
            });
          })
          .catch((error) => {
            console.error("Error fetching users:", error);
            document.getElementById(
              "userTableBody"
            ).innerHTML = `<tr><td colspan="6" class="text-center text-danger">Gagal memuat data</td></tr>`;
          });
      });

      function deleteUser(userId) {
        if (confirm("Apakah Anda yakin ingin menghapus user ini?")) {
          fetch(`http://localhost:3000/api/users/${userId}`, {
            method: "DELETE",
            credentials: "include",
          })
            .then((response) => response.json())
            .then((data) => {
              alert(data.message);
              location.reload();
            })
            .catch((error) => console.error("Error deleting user:", error));
        }
      }

      function verifyUser(userId) {
        fetch(`http://localhost:3000/api/users/${userId}/verify`, {
          method: "PUT",
          credentials: "include",
        })
          .then((response) => response.json())
          .then((data) => {
            alert(data.message);
            location.reload();
          })
          .catch((error) => console.error("Error verifying user:", error));
      }
    </script>
