<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Egg Classification - EggQTrack</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/style.css" />
  </head>

  <body>
    <section class="py-5">
      <nav class="navbar nav-bg navbar-expand-md fixed-top">
        <div class="container">
          <a class="navbar-brand ms-2" href="">
            <h1 class="fw-bold title pt-2">EggQTrack</h1>
          </a>
          <button
            aria-controls="navbarSupportedContent1"
            aria-expanded="false"
            aria-label="Toggle navigation"
            class="navbar-toggler"
            data-bs-target="#navbarSupportedContent1"
            data-bs-toggle="collapse"
            type="button"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          {% include './navbar.html' %}
        </div>
      </nav>
    </section>

    <section class="py-5">
      <div class="container">
        <div class="row gx-4 align-items-center">
          <div class="col-md-6 d-flex flex-column align-items-start">
            <h4 class="fw-bold ms-3">Upload Gambar</h4>
            <div
              class="container mt-3 d-flex flex-column align-items-center w-100"
            >
              <div class="upload-box w-100" id="dropArea">
                <input
                  type="file"
                  id="fileUpload"
                  class="d-none"
                  accept="image/*"
                />
                <label
                  for="fileUpload"
                  class="d-flex flex-column align-items-center"
                >
                  <img
                    src="https://cdn-icons-png.flaticon.com/512/1829/1829586.png"
                    alt="Upload Icon"
                  />
                  <p>
                    Drag and drop or
                    <a href="#" style="color: #fea728">browse</a> your file
                  </p>
                </label>
                <div class="file-name" id="fileName">No file chosen</div>
              </div>
            </div>
            <div class="d-flex justify-content-center w-100">
              <button class="btn-upload w-50 mt-3 fw-bold" type="button">
                Upload
              </button>
            </div>
          </div>

          <!-- Hasil Klasifikasi -->
          <div class="col-md-6">
            <h4 class="fw-bold">Hasil Klasifikasi</h4>
            <div class="result-box">
              <!-- Tempat menampilkan gambar -->
              <div class="result-image">
                <img
                  id="classifiedImage"
                  src=""
                  alt="Hasil Klasifikasi"
                  style="max-width: fit-content; display: none"
                />
              </div>
              <div class="accuracy-text mt-3">
                <h5 class="fw-bold">Hasil Akurasi</h5>
                <p>Klasifikasi Warna: <strong id="warnaText">...</strong></p>
                <p>
                  Klasifikasi Kebersihan:
                  <strong id="kebersihanText">...</strong>
                </p>
                <p>
                  Klasifikasi Keretakan:
                  <strong id="keretekanText">...</strong>
                </p>
                <!-- <p>
                  Probabilitas Warna:
                  <strong id="ProbwarnaText">...</strong>
                </p>
                <p>
                  Probabilitas Kebersihan:
                  <strong id="ProbkebersihanText">...</strong>
                </p> -->
                <p>
                  <strong>Mutu Telur:</strong>
                  <span class="fw-bold" id="mutuText">...</span>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      const dropArea = document.getElementById("dropArea");
      const fileInput = document.getElementById("fileUpload");
      const fileName = document.getElementById("fileName");
      document
        .querySelector(".btn-upload")
        .addEventListener("click", function (event) {
          event.preventDefault();
          const fileInput = document.getElementById("fileUpload");
          const file = fileInput.files[0];

          if (!file) {
            Swal.fire({
              icon: "warning",
              title: "Oops...",
              text: "Pilih file terlebih dahulu!",
            });
            return;
          }

          Swal.fire({
            title: "Uploading...",
            text: "Silakan tunggu, file sedang diproses",
            allowOutsideClick: false,
            showConfirmButton: false,
            willOpen: () => {
              Swal.showLoading();
            },
          });
          const formData = new FormData();
          formData.append("file", file);

          fetch("http://localhost:3000/api/klasifikasi", {
            method: "POST",
            body: formData,
            credentials: "include",
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.message) {
                Swal.fire({
                  icon: "success",
                  title: "Upload Berhasil!",
                  text: "File berhasil diklasifikasikan.",
                });

                document.getElementById(
                  "classifiedImage"
                ).src = `http://localhost:3000/${data.data.citra}`;
                document.getElementById("classifiedImage").style.display =
                  "block";
                document.getElementById("warnaText").innerText =
                  data.data.Warna + ` (${data.data.Probabilitas_Warna * 100}%)`;
                document.getElementById("kebersihanText").innerText =
                  data.data.Kebersihan +
                  ` (${data.data.Probabilitas_Kebersihan * 100}%)`;
                document.getElementById("keretekanText").innerText =
                  data.data.Keretakan +
                  ` (${data.data.Probabilitas_Keretakan * 100}%)`;
                document.getElementById("mutuText").innerText =
                  data.data.hasil_klasifikasi;
                const rgb = JSON.parse(data.data.RGB);
                const glcm = JSON.parse(data.data.GLCM);

                const resultBox = document.querySelector(".result-box");

                resultBox.innerHTML;
              } else {
                alert("Gagal mengunggah file: " + data.error);
              }
            })
            .catch((error) => {
              console.error("Error:", error);
              Swal.fire({
                icon: "error",
                title: "Terjadi Kesalahan!",
                text: "Ada masalah saat mengunggah file.",
              });
            });
        });

      dropArea.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", function () {
        fileName.textContent = this.files[0]
          ? this.files[0].name
          : "No file chosen";
      });

      dropArea.addEventListener("dragover", (event) => {
        event.preventDefault();
        dropArea.style.backgroundColor = "#ffe6b3";
      });

      dropArea.addEventListener("dragleave", () => {
        dropArea.style.backgroundColor = "#FFF6EB";
      });

      dropArea.addEventListener("drop", (event) => {
        event.preventDefault();
        dropArea.style.backgroundColor = "#FFF6EB";

        if (event.dataTransfer.files.length > 0) {
          fileInput.files = event.dataTransfer.files;
          fileName.textContent = event.dataTransfer.files[0].name;
        }
      });
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("http://localhost:3000/api/profile", { credentials: "include" })
          .then((response) => response.json())
          .then((data) => {
            if (data.user) {
              document.getElementById("username").innerText =
                data.user.username;
              if (data.user.role === "admin") {
                document.getElementById("admins").style.display = "block";
                document.getElementById("data_admins").style.display = "block";
              }
            } else {
              window.location.href = "/login";
            }
          })
          .catch((error) => console.error("Error fetching user info:", error));

        document
          .getElementById("logoutBtn")
          .addEventListener("click", function (event) {
            event.preventDefault();

            fetch("http://localhost:3000/api/logout", {
              method: "POST",
              credentials: "include",
            })
              .then(() => {
                Swal.fire({
                  icon: "success",
                  title: "Logout Berhasil!",
                  text: "Anda akan dialihkan ke halaman login.",
                  timer: 1500,
                  showConfirmButton: false,
                }).then(() => {
                  window.location.href = "/login";
                });
              })
              .catch((error) => console.error("Error during logout:", error));
          });
      });
    </script>
  </body>
</html>
