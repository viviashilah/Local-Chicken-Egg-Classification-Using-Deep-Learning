<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proses Klasifikasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="../static/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Kanit", sans-serif;
        background-color: #fef3e7;
        margin: 0;
        padding: 0;
      }

      .container {
        padding: 20px;
      }

      .back-button {
        background: none;
        border: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 20px;
      }

      .content-box {
        background-color: white;
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 30px;
      }

      h2 {
        margin-bottom: 30px;
      }

      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }

      .step {
        background-color: #fceddb;
        border: 1px solid #999;
        border-radius: 10px;
        text-align: center;
        padding: 10px;
      }

      .step p {
        margin: 0 0 10px;
        font-weight: bold;
      }

      .img-box {
        width: 120px;
        height: 120px;
        margin: 0 auto 10px;
        border: 1px solid #000;
        position: relative;
        /* background-image: linear-gradient(
            45deg,
            transparent 49%,
            #000 49%,
            #000 51%,
            transparent 51%
          ),
          linear-gradient(
            -45deg,
            transparent 49%,
            #000 49%,
            #000 51%,
            transparent 51%
          ); */
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        overflow: hidden;
      }

      .img-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        position: absolute;
        top: 0;
        left: 0;
      }

      .result {
        background-color: #fff;
        border-radius: 10px;
        padding: 20px;
        width: 250px;
        flex-shrink: 0;
      }

      .result .name-box {
        width: 150px;
        height: 150px;
        margin: 10px auto;
      }

      .result span {
        display: block;
        text-align: center;
        margin-bottom: 15px;
      }

      @media (max-width: 768px) {
        .steps {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button
        class="back-button d-flex align-items-center text-dark"
        onclick="history.back()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-6 h-6 me-2"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 19l-7-7 7-7"
          />
        </svg>
        <span>Back</span>
      </button>

      <div class="content-box d-flex flex-wrap gap-4 flex-md-nowrap">
        <!-- Proses Klasifikasi -->
        <div class="flex-grow-1">
          <h2 class="fw-bold ms-3">Proses Klasifikasi</h2>
          <div class="steps">
            <div class="step">
              <p>Step 1 :</p>
              <div class="img-box">
                <img src="" alt="Gambar Asli" />
              </div>
              <span>Gambar Asli</span>
            </div>
            <div class="step">
              <p>Step 2 :</p>
              <div class="img-box">
                <img src="" alt="Remove Background" />
              </div>
              <span>Remove Background</span>
            </div>
            <div class="step">
              <p>Step 3 :</p>
              <div class="img-box">
                <img src="" alt="Cropping + Sharpen" />
              </div>
              <span>Cropping + Sharpen</span>
            </div>
            <div class="step">
              <p>Step 4 :</p>
              <div class="img-box">
                <img src="" alt="Resized" />
              </div>
              <span>Resized</span>
            </div>
            <div class="step">
              <p>Step 5 :</p>
              <div class="img-box">
                <img src="" alt="Grayscale" />
              </div>
              <span>Grayscale</span>
            </div>
            <div class="step">
              <p>Step 6 :</p>
              <div class="img-box">
                <img src="" alt="Canny" />
              </div>
              <span>Canny</span>
            </div>
          </div>
        </div>

        <!-- Hasil Klasifikasi -->
        <div class="result">
          <h3>Hasil Klasifikasi :</h3>
          <div class="img-box name-box">
            <img src="" alt="Gambar hasil klasifikasi" />
          </div>
          <span></span>
          <p><strong></strong></p>
          <p><strong></strong></p>
          <p><strong></strong></p>
          <p><strong></strong></p>
          <p><strong></strong></p>
        </div>
      </div>
    </div>

    <script>
      // Ambil ID dari path URL
      const pathParts = window.location.pathname.split("/");
      const id = pathParts[pathParts.length - 1];

      // URL API
      const apiUrl = `/api/klasifikasi/${id}`;

      fetch(apiUrl)
        .then((response) => {
          if (!response.ok) {
            throw new Error("Gagal ambil data dari API");
          }
          return response.json();
        })
        .then((data) => {
          // Masukkan hasil ke HTML
          document.querySelector(".result h3").innerText =
            "Hasil Klasifikasi : " + data["hasil_klasifikasi"];
          document.querySelector(".result span").innerText = data["citra"]
            .split("/")
            .pop();

          // Tambahkan data ke hasil
          const resultBox = document.querySelector(".result");
          const rgb = JSON.parse(data["RGB"]);
          const glcm = JSON.parse(data["GLCM"]);

          resultBox.innerHTML += `
  <p><strong>Keretakan:</strong> ${data["Keretakan"]}</p>
  <p><strong>Warna:</strong> ${data["Warna"]}</p>
  <p><strong>Kebersihan:</strong> ${data["Kebersihan"]}</p>
  <p><strong>Nilai RGB:</strong><br> 
    R: ${rgb[0].toFixed(2)},<br>
    G: ${rgb[1].toFixed(2)},<br>
    B: ${rgb[2].toFixed(2)}
  </p>
  <p><strong>Nilai GLCM:</strong><br>
    Contrast: ${glcm[0].toFixed(4)},<br>
    Dissimilarity: ${glcm[1].toFixed(4)},<br>
    Homogeneity: ${glcm[2].toFixed(4)},<br>
    Energy: ${glcm[3].toFixed(4)},<br>
    Correlation: ${glcm[4].toFixed(4)}
  </p>
`;

          // Isi gambar untuk setiap step
          const imgBoxes = document.querySelectorAll(".step .img-box img");
          if (imgBoxes.length > 0) {
            imgBoxes[0].src = `/uploads/${data["citra"].split("\\").pop()}`; // Gambar asli
            imgBoxes[0].alt = "Gambar Asli";
            imgBoxes[1].src = `/output/removed_bg_${data["citra"]
              .split("\\")
              .pop()}`; // Remove Background
            imgBoxes[1].alt = "Remove Background";
            imgBoxes[2].src = `/output/sharpened_${data["citra"]
              .split("\\")
              .pop()}`; // Cropping + Sharpen
            imgBoxes[2].alt = "Cropping + Sharpen";
            imgBoxes[3].src = `/output/resized_${data["citra"]
              .split("\\")
              .pop()}`; // Resized
            imgBoxes[3].alt = "Resized";
            imgBoxes[4].src = `/output/gray_${data["citra"].split("\\").pop()}`; // Grayscale
            imgBoxes[4].alt = "Grayscale";
            imgBoxes[5].src = `/output/canny_${data["citra"].split("\\").pop()}`; // Canny
            imgBoxes[5].alt = "Canny";
          }
          const nameBox = document.querySelector(".name-box img");
          nameBox.src = `/uploads/${data["citra"].split("\\").pop()}`; // Gambar asli
          nameBox.alt = "Hasil klasifikasi";
        })
        .catch((error) => {
          console.error("Terjadi kesalahan:", error);
        });
    </script>
  </body>
</html>
